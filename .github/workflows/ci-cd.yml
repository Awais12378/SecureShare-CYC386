name: Security CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

jobs:
  security-scan:
    name: Security Scan (SAST)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-flask
          pip install semgrep
      
      - name: Run Semgrep SAST
        run: |
          semgrep --config .semgrep.yml --json --output semgrep_results.json app/
        continue-on-error: true
      
      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep_results.json
        if: always()
      
      - name: Check for High/Critical findings
        run: |
          python scripts/check_semgrep_severity.py semgrep_results.json
        if: always()
      
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-flask
      
      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short
      
      - name: Run security regression tests
        run: |
          pytest tests/test_csrf_protection.py -v
          pytest tests/test_clickjacking_protection.py -v
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: pytest-report.html
        if: always()

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [security-scan, test]
    
    steps:
      - name: Download Semgrep results
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results
      
      - name: Check security gate
        run: |
          echo "Checking security gate..."
          
          # Check Semgrep results
          if [ -f semgrep_results.json ]; then
            python scripts/check_semgrep_severity.py semgrep_results.json
            SEMGREP_EXIT=$?
          else
            echo "No Semgrep results found"
            SEMGREP_EXIT=0
          fi
          
          # Fail if security check failed
          if [ $SEMGREP_EXIT -ne 0 ]; then
            echo "SECURITY GATE FAILED"
            exit 1
          fi
          
          echo "SECURITY GATE PASSED"
